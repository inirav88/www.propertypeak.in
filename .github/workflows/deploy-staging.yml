name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H staging.propertypeak.in >> ~/.ssh/known_hosts

      - name: Deploy to staging server
        run: |
          ssh -o StrictHostKeyChecking=yes propertypeak-staging@staging.propertypeak.in << 'EOF'
            set -e
            cd /home/propertypeak-staging/htdocs/staging.propertypeak.in

            git fetch origin
            git reset --hard origin/staging

            php artisan migrate --force || true
            php artisan optimize:clear
            php artisan optimize
          EOF
